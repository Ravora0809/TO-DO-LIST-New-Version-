<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter benign Vite dev WebSocket connection messages in sandboxed dev container
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = typeof args[0] === 'string' ? args[0] : '';
          if (
            msg.includes('[vite] failed to connect to websocket') ||
            msg.includes('[vite] server connection lost') ||
            msg.includes('vite-plugin-pwa:dev-ready')
          ) {
            console.debug(...args);
            return;
          }
          origConsoleError.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
